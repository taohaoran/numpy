# GitHub Pages 部署 workflow（GitHub Actions 发布源）
# 内容源优先级：存在 docs-archify / docs_archify → 站点严格等于该源内容；
# 否则回退部署 docs。构建时统一执行 md→html 渲染 + 导览 index.md 生成。
name: Deploy NumPy architecture docs to GitHub Pages

on:
  push:
    branches: [feat-docs-20260916]
    paths:
      - 'docs/**'
      - 'docs-archify/**'
      - 'docs_archify/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site content (archify source priority)
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site
          if [ -d "docs-archify" ] || [ -d "docs_archify" ]; then
            SRC=""
            if [ -d "docs-archify" ]; then SRC="docs-archify"; else SRC="docs_archify"; fi
            echo "==> $SRC found -> deploying its content strictly"
            cp -R "$SRC/." site/
          else
            echo "==> no archify source dir found -> deploying docs"
            cp -R docs/. site/
          fi
          pip install --quiet markdown
          python3 scripts/build-docs-html.py site --site-name "NumPy 架构文档" --group-label "architecture=架构"
          touch site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
